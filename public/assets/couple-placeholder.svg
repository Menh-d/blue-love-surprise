<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8ECFF"/>
      <stop offset="55%" stop-color="#F2F8FF"/>
      <stop offset="100%" stop-color="#DCD9FF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8CC8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8CC8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#sky)"/>
  <circle cx="300" cy="190" r="160" fill="url(#sunGlow)"/>
  <!-- Soft clouds -->
  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="140" cy="120" rx="65" ry="24"/>
    <ellipse cx="170" cy="110" rx="45" ry="28"/>
    <ellipse cx="460" cy="105" rx="70" ry="24"/>
    <ellipse cx="430" cy="95" rx="48" ry="26"/>
  </g>
  <!-- Distant hills -->
  <path d="M0 350 Q160 295 320 340 T600 330 L600 450 L0 450 Z" fill="#BCE0FF" opacity="0.65"/>
  <path d="M0 375 Q220 330 410 365 T600 355 L600 450 L0 450 Z" fill="#8CC8FF" opacity="0.55"/>
  <!-- Cute minimalist couple silhouettes & floating blue heart -->
  <g transform="translate(300, 235)">
    <!-- Floating heart between them -->
    <path d="M0 -72 C-12 -88 -36 -80 -36 -58 C-36 -36 0 -16 0 -6 C0 -16 36 -36 36 -58 C36 -80 12 -88 0 -72 Z" fill="#3478D4" opacity="0.9"/>
    <path d="M0 -65 C-8 -76 -24 -70 -24 -55 C-24 -40 0 -26 0 -19 C0 -26 24 -40 24 -55 C24 -70 8 -76 0 -65 Z" fill="#8CC8FF"/>
    <!-- Left figure -->
    <circle cx="-48" cy="-8" r="24" fill="#183B63"/>
    <path d="M-82 85 C-82 36 -14 36 -14 85 Z" fill="#3478D4"/>
    <!-- Right figure -->
    <circle cx="48" cy="-2" r="22" fill="#183B63"/>
    <path d="M16 85 C16 40 80 40 80 85 Z" fill="#5B9BF0"/>
    <!-- Holding hands -->
    <path d="M-22 58 Q0 70 22 58" stroke="#183B63" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Sparkles -->
  <g fill="#3478D4" opacity="0.55">
    <circle cx="190" cy="175" r="4"/>
    <circle cx="415" cy="165" r="5"/>
    <circle cx="240" cy="115" r="3"/>
    <circle cx="365" cy="120" r="3.5"/>
  </g>
  <rect x="130" y="388" width="340" height="34" rx="17" fill="#FFFEFA" opacity="0.88"/>
  <text x="300" y="410" text-anchor="middle" font-family="'Noto Sans Lao', sans-serif" font-size="14" font-weight="600" fill="#183B63">
    [ຮູບຄູ່ Placeholder — ປ່ຽນຮູບຈິງໄດ້ໃນ Admin 💙]
  </text>
</svg>
