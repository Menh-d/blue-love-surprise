<!DOCTYPE html>
<html lang="lo">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Blue Love Surprise 💙 — ກຸ່ມດາວຫົວໃຈ & ຈົດໝາຍສີຟ້າ</title>

  <header class="floating-top-bar" style="justify-content: flex-end;">

    </button>
  </header>

  <!-- Main Stage Viewport -->
  <div id="stage-viewport"></div>

  <script src="./app.js"></script>

</html>
