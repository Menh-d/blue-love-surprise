<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BLUE LETTER Admin — ຈັດການເວັບຈົດໝາຍສີຟ້າ 💙</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100dvh;
      max-width: 1360px;
      margin: 0 auto;
      gap: 20px;
      padding: 18px;
      position: relative;
      z-index: 5;
    }
    .admin-sidebar {
      background: var(--paper-cream);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 18px 14px;
      box-shadow: var(--shadow-card);
      height: fit-content;
      position: sticky;
      top: 18px;
    }
    .admin-nav-btn {
      width: 100%;
      min-height: 44px;
      text-align: left;
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-navy);
      font-family: var(--font-lao);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      transition: background 150ms ease;
    }
    .admin-nav-btn:hover {
      background: #EAF4FF;
    }
    .admin-nav-btn.active {
      background: var(--cta-blue);
      color: #FFFFFF;
    }
    .admin-main {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .admin-topbar {
      background: var(--paper-cream);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-card);
      position: sticky;
      top: 18px;
      z-index: 10;
    }
    .admin-panel {
      background: var(--paper-cream);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-group label {
      font-weight: 600;
      font-size: 0.94rem;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .badge-published {
      background: #E3F6EC;
      color: #145235;
    }
    .badge-draft {
      background: #FFF4DC;
      color: #7A4F08;
    }
    .stage-item-row {
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #F9FCFF;
    }
    @media (max-width: 860px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }
      .admin-sidebar {
        position: static;
        display: flex;
        overflow-x: auto;
        gap: 6px;
        padding: 10px;
      }
      .admin-nav-btn {
        width: auto;
        white-space: nowrap;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-backdrop" aria-hidden="true"></div>
  <div id="admin-root">
    <div style="max-width:440px; margin:80px auto; text-align:center;" class="stage-card">
      <p>ກຳລັງກວດສອບສິດ Admin... 💙</p>
    </div>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
