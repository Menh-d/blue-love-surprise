<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BLUE LOVE Admin — ຈັດການເວັບໄຊ 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <style>
    :root {
      --admin-navy: #0f274a;
      --admin-blue: #2563eb;
      --admin-sky: #60a5fa;
      --admin-card-bg: rgba(255, 255, 255, 0.94);
      --admin-border: #bfdbfe;
    }

    body.admin-body {
      background: linear-gradient(135deg, #eef6ff 0%, #dbeafe 50%, #eff6ff 100%);
      font-family: 'Noto Sans Lao', var(--font-sans), sans-serif;
      color: #0f274a;
      min-height: 100dvh;
      padding-bottom: 60px;
    }

    /* Admin Login Screen */
    .admin-login-wrapper {
      min-height: 90dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1.5px solid #bfdbfe;
      border-radius: 24px;
      padding: 36px 30px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 48px rgba(30, 58, 109, 0.14);
      text-align: center;
      animation: popPillEntrance 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.25);
    }

    .admin-login-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .admin-login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .admin-login-sub {
      font-size: 0.88rem;
      color: #475569;
      margin-bottom: 24px;
    }

    .admin-input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .admin-input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .admin-input-field {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #bfdbfe;
      background: #f8fafc;
      font-family: 'Noto Sans Lao', var(--font-sans), sans-serif;
      font-size: 0.95rem;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .admin-input-field:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.2);
    }

    .admin-primary-btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-family: 'Noto Sans Lao', var(--font-sans), sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .admin-primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.4);
    }

    .admin-primary-btn:active {
      transform: scale(0.98);
    }

    /* Main Dashboard Layout */
    .admin-dashboard {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .admin-navbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 1.5px solid #bfdbfe;
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 10px 28px rgba(30, 58, 109, 0.08);
      margin-bottom: 20px;
      position: sticky;
      top: 14px;
      z-index: 100;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      color: #1e3a8a;
    }

    .admin-nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .admin-pill-btn {
      padding: 8px 16px;
      border-radius: 999px;
      font-family: 'Noto Sans Lao', var(--font-sans), sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1e40af;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .admin-pill-btn:hover {
      background: #dbeafe;
      transform: translateY(-1px);
    }

    .admin-pill-btn.save-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border-color: #059669;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .admin-pill-btn.save-btn:hover {
      background: linear-gradient(135deg, #059669, #047857);
    }

    /* Tabs Header */
    .admin-tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .admin-tab-item {
      padding: 10px 20px;
      border-radius: 14px;
      border: 1.5px solid #bfdbfe;
      background: rgba(255, 255, 255, 0.85);
      color: #1e3a8a;
      font-family: 'Noto Sans Lao', var(--font-sans), sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .admin-tab-item.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }

    /* Content Cards */
    .admin-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1.5px solid #bfdbfe;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 28px rgba(30, 58, 109, 0.08);
    }

    .admin-card-header {
      border-bottom: 1.5px solid #eff6ff;
      padding-bottom: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .admin-grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .admin-color-picker-box {
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 12px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-color-input {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
      padding: 0;
    }

    .admin-color-info {
      flex: 1;
    }

    .admin-color-name {
      font-size: 0.86rem;
      font-weight: 700;
      color: #1e3a8a;
    }

    .admin-color-hex {
      font-size: 0.8rem;
      color: #64748b;
      font-family: monospace;
    }

    /* Photo Upload / Preview */
    .admin-photo-preview-box {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px dashed #93c5fd;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .admin-photo-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .admin-preset-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px;
      scrollbar-width: none;
    }

    .admin-preset-thumb {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .admin-preset-thumb:hover,
    .admin-preset-thumb.active {
      border-color: #2563eb;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Alert Banner */
    .admin-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 22px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      z-index: 9999;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      display: none;
      animation: popPillEntrance 0.35s ease;
    }

    .admin-toast.success {
      background: #10b981;
      color: #ffffff;
      border: 1px solid #059669;
    }

    .admin-toast.error {
      background: #ef4444;
      color: #ffffff;
      border: 1px solid #dc2626;
    }

    /* ==================== LIVE ACTIVITY MONITOR STYLES ==================== */
    .monitor-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .monitor-pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: monitorPulse 1.8s infinite;
    }
    @keyframes monitorPulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .monitor-overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .monitor-stage-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .monitor-stage-card.is-completed {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .monitor-stage-card.is-active {
      background: #eff6ff;
      border-color: #93c5fd;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.12);
    }
    .monitor-stage-icon {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .monitor-stage-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .monitor-stage-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
    }
    .monitor-stage-card.is-completed .monitor-stage-badge {
      background: #dcfce7;
      color: #15803d;
    }
    .monitor-stage-card.is-active .monitor-stage-badge {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .monitor-reply-hero {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 20px;
      padding: 20px 24px;
      color: #ffffff;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      animation: popPillEntrance 0.5s ease;
    }
    .monitor-reply-hero::after {
      content: '💌';
      position: absolute;
      right: 18px;
      bottom: 10px;
      font-size: 4rem;
      opacity: 0.15;
      pointer-events: none;
    }
    .monitor-reply-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #bfdbfe;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .monitor-reply-text {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .monitor-reply-meta {
      font-size: 0.78rem;
      color: #dbeafe;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .monitor-timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .monitor-timeline-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      animation: popPillEntrance 0.3s ease;
    }
    .monitor-timeline-item:hover {
      background: #ffffff;
      border-color: #bfdbfe;
      transform: translateX(3px);
      box-shadow: 0 4px 12px rgba(30, 58, 109, 0.06);
    }
    .monitor-timeline-item.is-reply {
      background: #eff6ff;
      border: 1.5px solid #93c5fd;
    }
    .monitor-timeline-icon {
      font-size: 1.4rem;
      line-height: 1;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .monitor-timeline-content {
      flex: 1;
      min-width: 0;
    }
    .monitor-timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
      flex-wrap: wrap;
    }
    .monitor-timeline-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f274a;
    }
    .monitor-timeline-time {
      font-size: 0.76rem;
      color: #64748b;
      font-family: monospace;
      white-space: nowrap;
    }
    .monitor-timeline-detail {
      font-size: 0.84rem;
      color: #475569;
      line-height: 1.35;
      word-break: break-word;
    }
    .monitor-timeline-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .monitor-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
    }
    .monitor-device-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
    }

    .monitor-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .monitor-filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #bfdbfe;
      background: #ffffff;
      color: #1e40af;
      transition: all 0.2s ease;
    }
    .monitor-filter-chip.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }
  </style>
</head>
<body class="admin-body">
  <div class="admin-toast" id="admin-toast"></div>

  <div id="admin-app-root">
    <!-- Rendered dynamically by admin.js -->
  </div>

  <script src="./admin.js"></script>
</body>
</html>
